version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: db-api-projeto-trainee
    restart: always
    environment:
      MYSQL_DATABASE: store-projeto-trainee
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
